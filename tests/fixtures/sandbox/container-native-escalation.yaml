name: container-native-escalation
needs:
  os: [linux]
  capabilities:
    - clean-home
    - network:*
  trust: first-party
  native: false
resources:
  cpu: 1
  memory: 256MB
  timeout: 30
steps:
  setup:
    - systemctl start ecc-demo
  assert:
    - systemctl is-active ecc-demo
report: exit-only
