<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0c15a" />
      <stop offset="1" stop-color="#a9822a" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#111113" />

    <!-- The mark spans y 135.6..388, so its own centre is y=261.8, not 256.
       Translating by that value (rather than an eyeballed 243) is what
       actually centres it; the old value left it 17 units low, which is
       what you see as an off-centre icon on an installed home screen.
       At 0.92 scale the mark's corners sit 168 from centre, well inside
       the maskable safe-zone radius of 204.8. -->
  <g transform="translate(256,256) scale(0.92) translate(-256,-261.8)">
    <path
      fill="#f2efe7"
      d="M124,388 L124,258 A132,132 0 0 1 388,258 L388,388 L324,388 L324,258 A68,68 0 0 0 188,258 L188,388 Z"
    />
    <path
      fill="url(#gold)"
      d="M206.5,135.6 A132,132 0 0 1 305.5,135.6 L281.5,195.0 A68,68 0 0 0 230.5,195.0 Z"
    />
    <g stroke="#111113" stroke-width="8" stroke-linecap="round">
      <line x1="230.5" y1="195.0" x2="206.5" y2="135.6" />
      <line x1="281.5" y1="195.0" x2="305.5" y2="135.6" />
      <line x1="200.3" y1="219.0" x2="147.9" y2="182.3" />
      <line x1="311.7" y1="219.0" x2="364.1" y2="182.3" />
      <line x1="124" y1="324" x2="188" y2="324" />
      <line x1="324" y1="324" x2="388" y2="324" />
    </g>
  </g>
</svg>
