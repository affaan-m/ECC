name: AgentShield pipeline audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/copilot-instructions.md"
      - "src/cartoon_pipeline/**"
      - "config/**"
      - "tests/cartoon_pipeline/**"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/copilot-instructions.md"
      - "src/cartoon_pipeline/**"
      - "config/**"
      - "tests/cartoon_pipeline/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan workflow files with AgentShield
        uses: affaan-m/agentshield@b0891303bdcd6037376a94263d45cfd2ff3dfb98 # v1.6.0
        with:
          path: .github/workflows
          min-severity: high
          fail-on-findings: true
      - name: Scan OAuth and provider adapters with AgentShield
        uses: affaan-m/agentshield@b0891303bdcd6037376a94263d45cfd2ff3dfb98 # v1.6.0
        with:
          path: src/cartoon_pipeline
          min-severity: high
          fail-on-findings: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pipeline test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run mocked provider and policy tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/cartoon_pipeline -q
