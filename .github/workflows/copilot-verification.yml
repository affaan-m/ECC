name: Copilot port fixture verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    name: Copilot fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      ECC_TEST_PYTHON: python
      PYTHON: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build:opencode
      - run: npm run copilot:check
      - run: npm run test:validators
      - name: Exercise managed project and experimental plugin fixtures
        shell: bash
        run: |
          set -o pipefail
          mkdir -p copilot-verification
          npm run test:copilot 2>&1 | tee copilot-verification/fixtures.log
      - name: Install from the generated npm tarball
        shell: bash
        run: |
          set -o pipefail
          npm run copilot:verify-package 2>&1 | tee copilot-verification/package.log
      - name: Check baseline upgrade and rollback
        shell: bash
        run: |
          set -o pipefail
          node tests/fixtures/copilot-upgrade.js 2>&1 | tee copilot-verification/upgrade.log
      - name: Save fixture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-fixtures-${{ matrix.os }}
          path: copilot-verification/
          if-no-files-found: ignore
