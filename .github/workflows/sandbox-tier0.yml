name: Sandbox Tier 0 acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sandbox-tier0.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'schemas/sandbox-*.schema.json'
      - 'scripts/sandbox/**'
      - 'tests/fixtures/sandbox/**'
      - 'tests/sandbox/**'
  workflow_dispatch:

concurrency:
  group: sandbox-tier0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Restricted process contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'

      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Run Tier 0 contracts, routing, and SRT adapter tests
        run: npm run test:sandbox

      - name: Validate packaged runtime surface
        run: node tests/scripts/npm-publish-surface.test.js
