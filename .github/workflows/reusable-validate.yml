name: Reusable Validation Workflow

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20.x'

jobs:
  validate:
    name: Validate Components
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Validate agents
        run: node scripts/ci/validate-agents.js

      - name: Validate hooks
        run: node scripts/ci/validate-hooks.js

      - name: Validate commands
        run: node scripts/ci/validate-commands.js

      - name: Validate skills
        run: node scripts/ci/validate-skills.js

      - name: Validate skill quality (changed skills)
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Pull requests diff against their base branch. Pushes diff against the
          # commit before the push; new branches (all-zero SHA) and force pushes
          # (before SHA no longer in history) diff against the default branch so
          # every commit on the branch is covered, not just the last one.
          if [ -n "$PR_BASE_REF" ]; then
            base="origin/$PR_BASE_REF"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ -z "${PUSH_BEFORE_SHA//0/}" ]; then
            base="origin/${DEFAULT_BRANCH:-main}"
          elif [ -n "$PUSH_BEFORE_SHA" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          else
            base="origin/${DEFAULT_BRANCH:-main}"
          fi
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || {
            echo "ERROR: cannot resolve diff base '$base'" >&2
            exit 1
          }
          node scripts/ci/validate-skill-quality.js --strict --changed "$base"

      - name: Validate install manifests
        run: node scripts/ci/validate-install-manifests.js

      - name: Validate workflow security
        run: node scripts/ci/validate-workflow-security.js

      - name: Validate rules
        run: node scripts/ci/validate-rules.js

      - name: Check unicode safety
        run: node scripts/ci/check-unicode-safety.js

      - name: Validate no personal paths
        run: node scripts/ci/validate-no-personal-paths.js
