# Vibe hook protocol to the Claude Code protocol the ECC runners speak.

[[hooks]]
name = "pre-bash-dispatcher"
type = "pre_tool"
match = "bash"
command = "node scripts/hooks/vibe-hook-bridge.js scripts/hooks/pre-bash-dispatcher.js"
timeout = 15.0
description = "ECC pre-bash guard pipeline: block --no-verify, tmux dev reminders, commit quality, and gateguard fact-force checks."

[[hooks]]
name = "pre-write-doc-file-warning"
type = "pre_tool"
