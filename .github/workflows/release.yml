name: Release

on:
  release:
    types: [published]

# Prevent duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.npm_publish_state.outputs.already_published }}
      dist_tag: ${{ steps.npm_publish_state.outputs.dist_tag }}
      package_file: ${{ steps.pack.outputs.package_file }}

    steps:
      - name: Validate release payload
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            echo "::error::Missing tag_name in release payload"
            exit 1
          fi
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version tag format: $TAG_NAME. Expected vX.Y.Z or vX.Y.Z-prerelease"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run supply-chain IOC scan
        run: npm run security:ioc-scan

      - name: Verify OpenCode package payload
        run: node tests/scripts/build-opencode.test.js

      - name: Verify package version matches tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Verify release metadata stays in sync
        run: node tests/plugin-manifest.test.js

      - name: Check npm publish state
        id: npm_publish_state
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_DIST_TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
          echo "dist_tag=${NPM_DIST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare release highlights
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # Sanitize and save release body to file
          node -e "
            const { sanitizeAnnouncement } = require('./scripts/lib/utils');
            const fs = require('fs');
            const body = process.env.RELEASE_BODY || '';
            fs.writeFileSync('release_body.md', sanitizeAnnouncement(body));
          "

      - name: Pack npm artifact
        id: pack
        run: |
          npm pack --json > npm-pack.json
          PACKAGE_FILE=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('npm-pack.json', 'utf8')); console.log(data[0].filename)")
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecc-release-artifacts
          path: |
            release_body.md
            ${{ steps.pack.outputs.package_file }}
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecc-release-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Update GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body_path: release_body.md
          tag_name: ${{ github.event.release.tag_name }}

      - name: Publish npm package
        if: needs.verify.outputs.already_published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_FILE: ${{ needs.verify.outputs.package_file }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: npm publish "$PACKAGE_FILE" --access public --provenance --tag "$DIST_TAG"
