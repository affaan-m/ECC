<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111113" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Keystone" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Keystone - Daily Planner</title>
    <!--
      Resolve the theme before the first paint.

      React applies `data-theme` from a useEffect, which by definition runs
      after the page has already painted once — so a dark-theme user got a
      frame or two of the light palette on every launch, and (because the
      theme crossfade transition applied to that initial switch) then watched
      it fade from white to black over a quarter second. Reading the stored
      preference here, synchronously in <head>, means the very first paint is
      already the right colour. App.jsx still owns the theme afterwards; this
      only front-runs it.

      Deliberately defensive: any failure here must fall through to the
      light default rather than block the bundle from loading.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'system';
        try {
          var raw = localStorage.getItem('compass.data.v1');
          if (raw) theme = JSON.parse(raw).settings?.theme || 'system';
        } catch (e) {
          /* unreadable storage — fall through to the system preference */
        }
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        // Hold the page at the launch-screen colour until the splash fades
        // (App.jsx clears this); see `html.booting` in styles.css.
        root.classList.add('booting');
        // Keep the browser/OS chrome in step with the app on the first paint
        // too, rather than being pinned to the dark value in the tag above.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0f141a' : '#eef1f4');
        // A reload isn't an arrival, so it gets the short version of the
        // launch animation. Decided here because the markup below has to
        // carry the right class from its very first paint.
        try {
          var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
          if (nav && nav.type === 'reload') root.classList.add('boot-reload');
        } catch (e) {
          /* no Navigation Timing — treat it as a launch */
        }
        // Arm the theme crossfade only once the correct theme is already
        // painted, so it animates real theme *changes* and never the boot.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            root.classList.add('theme-ready');
          });
        });
      })();
    </script>
  </head>
  <body>
    <!--
      The launch animation lives here, in the document, rather than in a React
      component.

      It used to be rendered by App.jsx, which meant it could only begin once
      the bundle had downloaded, parsed and mounted — so the real sequence was
      the OS launch screen's static icon, then a stretch of flat colour while
      the JS loaded, and only then the animation. Three phases to show one
      logo.

      Inline, it paints with the first frame and plays *while* the bundle
      loads, so the animation is the loading screen rather than something that
      happens after it. The stylesheet is render-blocking and the module
      script is deferred, so the markup and its CSS are both ready before any
      JS runs. App.jsx only decides when to take it away (see #boot-splash in
      App.jsx), and if the bundle took longer than the animation it is already
      finished and simply leaves at once.
    -->
    <!--
      The launch sequence: both sides of the arch build up out of the floor
      and around the curve until they meet at the crown, the keystone fades
      in there and pulses once, and that pulse strikes a flash which swells
      into the gold flood the app opens out of. See the .splash-* rules in
      styles.css for the timings that chain them.
    -->
    <div id="boot-splash" class="splash" aria-hidden="true">
      <div class="splash-mark-wrap">
        <svg class="splash-mark" viewBox="116 122 280 280">
          <defs>
            <linearGradient id="splashGold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e0c15a" />
              <stop offset="1" stop-color="#a9822a" />
            </linearGradient>
            <!--
              The reveal for the arch, and the reason it travels the way it
              does.

              The mark is geometrically a constant-width band: outer radius
              132, inner 68, so a 64-wide ribbon running along radius 100 —
              and the legs sit on that same centreline at x=156 and x=356.
              That means the arch has a *path*, and the build can follow it
              instead of being wiped by a rectangle. Two mirrored halves,
              each drawn as a thick stroke from its foot at y=388, up the
              leg and around the curve, revealed by running
              stroke-dashoffset to zero. Both halves are the same length, so
              they climb in step and arrive together.

              They stop at 22° off vertical rather than at the apex, because
              that is exactly where the keystone's edges are — the wedge
              spans (230.5,195) to (281.5,195) on the inner radius, which is
              22.03° either side. Ending there leaves a keystone-shaped void
              at the crown for the keystone to fade into, instead of filling
              the crown with the arch's own cream and dropping the gold on
              top of it. The butt caps land flush along those radial edges,
              and the keystone's black edge strokes sit over the seam.

              pathLength="1" normalises each path so the dash maths is 1→0
              regardless of the real arc length. Masked rather than clipped
              because a clipPath uses a shape's fill area, not its stroke —
              and via a stroke-dash rather than SVG geometry properties,
              which Safari will not animate from CSS.
            -->
            <mask id="splashArchMask" maskUnits="userSpaceOnUse" x="100" y="100" width="312" height="312">
              <g fill="none" stroke="#fff" stroke-width="76">
                <path class="splash-build" pathLength="1" d="M156,388 L156,258 A100,100 0 0 1 218.5,165.3" />
                <path class="splash-build" pathLength="1" d="M356,388 L356,258 A100,100 0 0 0 293.5,165.3" />
              </g>
            </mask>
          </defs>
          <g mask="url(#splashArchMask)">
            <path
              fill="#f2efe7"
              d="M124,388 L124,258 A132,132 0 0 1 388,258 L388,388 L324,388 L324,258 A68,68 0 0 0 188,258 L188,388 Z"
            />
            <g stroke="#111113" stroke-width="7" stroke-linecap="round">
              <line x1="200.3" y1="219.0" x2="147.9" y2="182.3" />
              <line x1="311.7" y1="219.0" x2="364.1" y2="182.3" />
              <line x1="124" y1="324" x2="188" y2="324" />
              <line x1="324" y1="324" x2="388" y2="324" />
            </g>
          </g>
          <g class="splash-keystone">
            <path
              fill="url(#splashGold)"
              d="M206.5,135.6 A132,132 0 0 1 305.5,135.6 L281.5,195.0 A68,68 0 0 0 230.5,195.0 Z"
            />
            <g stroke="#111113" stroke-width="7" stroke-linecap="round">
              <line x1="230.5" y1="195.0" x2="206.5" y2="135.6" />
              <line x1="281.5" y1="195.0" x2="305.5" y2="135.6" />
            </g>
          </g>
        </svg>
        <!--
          Flash and flood are concentric circles pinned to the keystone, so
          the flood grows out of exactly the point the flash struck and the
          two read as one event rather than two effects that happen to
          overlap. Inside the mark wrapper so they track the mark's size and
          position on any screen without hard-coded viewport maths.
        -->
        <span class="splash-flash"></span>
        <span class="splash-flood"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      Boot watchdog. Installed standalone, the app has no browser chrome: if
      the bundle 404s, fails to parse, or throws before React mounts, the
      window just stays on the manifest's black background_color with no
      error, no address bar, and no way to reload. That is indistinguishable
      from a hang, and the only user-visible fix is deleting the app.

      So: if #root is still empty well after load, say so and offer a repair.
      The repair clears the service worker and its caches — the parts that
      can serve a stale or broken shell — and deliberately does NOT touch
      localStorage, which is where every goal, contact, event and note lives.
    -->
    <script>
      (function () {
        var BOOT_TIMEOUT = 8000;
        function booted() {
          var root = document.getElementById('root');
          return root && root.children.length > 0;
        }
        function repair() {
          var done = function () { location.reload(); };
          if (!('serviceWorker' in navigator)) return done();
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
            .then(function () {
              return window.caches ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }) : null;
            })
            .then(done, done);
        }
        setTimeout(function () {
          if (booted()) return;
          var el = document.createElement('div');
          el.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;text-align:center;background:#111113;color:#f2efe7;font:16px/1.5 system-ui,-apple-system,sans-serif');
          el.innerHTML =
            '<div><p style="font-size:19px;font-weight:600;margin:0 0 8px">Keystone didn\'t finish loading</p>' +
            '<p style="color:#93a0ad;margin:0 0 20px">Your data is safe on this device. Repairing clears the offline copy only.</p>' +
            '<button id="ks-repair" style="font:inherit;font-weight:600;padding:12px 22px;border:0;border-radius:12px;background:#a9822a;color:#fff">Repair and reload</button></div>';
          document.body.appendChild(el);
          document.getElementById('ks-repair').addEventListener('click', repair);
        }, BOOT_TIMEOUT);
      })();
    </script>
  </body>
</html>
