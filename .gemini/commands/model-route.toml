description = "Recommend the best model tier for the current task based on complexity, risk, and budget."
prompt = '''
# ECC Command: /model-route

This Gemini custom command adapts the equivalent ECC command prompt.
When arguments are supplied, Gemini CLI injects them through `{{args}}`.

# Model Route Command

Recommend the best model tier for the current task by complexity and budget.

## Usage

`/model-route [task-description] [--budget low|med|high]`

## Routing Heuristic

- `haiku`: deterministic, low-risk mechanical changes
- `sonnet`: default for implementation and refactors
- `opus`: architecture, deep review, ambiguous requirements

## Required Output

- recommended model
- confidence level
- why this model fits
- fallback model if first attempt fails

## Arguments

{{args}}:
- `[task-description]` optional free-text
- `--budget low|med|high` optional
'''
